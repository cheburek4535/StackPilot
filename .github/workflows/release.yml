name: Release Build

on:
  # Ручной запуск из интерфейса GitHub
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.1)'
        required: true
        type: string

  # Автоматический запуск при создании тега
  push:
    tags:
      - 'v*'

jobs:
  quality:
    # Проверки перед сборкой: если тесты падают, релиз не собирается
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks (svelte-check)
        run: npm run check

      - name: Frontend tests (vitest)
        run: npm test

      - name: Rust tests (cargo test)
        run: cargo test --locked
        working-directory: ./src-tauri

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create or reuse release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.get-version.outputs.version }}';
            const fs = require('fs');
            let body = 'Автоматически созданный релиз';
            try {
              if (fs.existsSync('RELEASE_NOTES.md')) {
                body = fs.readFileSync('RELEASE_NOTES.md', 'utf8');
              }
            } catch (e) {
              core.warning(`Не удалось прочитать RELEASE_NOTES.md: ${e.message}`);
            }

            // Если релиз с таким тегом уже существует (в том числе черновик) —
            // переиспользуем его, чтобы пересобрать сборки без создания новой
            // версии и без потери описания/имени релиза.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const existing = releases.find((r) => r.tag_name === version);
            if (existing) {
              core.info(`Переиспользую существующий релиз ${version} (id ${existing.id})`);
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.id,
                body: body
              });
              return existing.id;
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `StackPilot ${version}`,
              body: body,
              draft: true,
              prerelease: false
            });
            return data.id;

  build-tauri:
    needs: [create-release, quality]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            cli_name: 'stkpil'
            archive_name: 'stkpil-macos-aarch64.tar.gz'
            name: 'macOS (Apple Silicon)'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
            cli_name: 'stkpil'
            archive_name: 'stkpil-macos-x86_64.tar.gz'
            name: 'macOS (Intel)'
          - platform: 'ubuntu-22.04'
            args: ''
            target: ''
            cli_name: 'stkpil'
            archive_name: 'stkpil-linux-x86_64.tar.gz'
            name: 'Linux'
          - platform: 'windows-latest'
            args: ''
            target: ''
            cli_name: 'stkpil.exe'
            archive_name: 'stkpil-windows-x64.zip'
            name: 'Windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Build stkpil CLI binary
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --bin stkpil --target ${{ matrix.target }}
          else
            cargo build --release --bin stkpil
          fi
        shell: bash
        working-directory: ./src-tauri

      - name: Package stkpil CLI
        shell: bash
        run: |
          mkdir -p dist-cli
          if [ -n "${{ matrix.target }}" ]; then
            BIN="src-tauri/target/${{ matrix.target }}/release/${{ matrix.cli_name }}"
          else
            BIN="src-tauri/target/release/${{ matrix.cli_name }}"
          fi

          cp "$BIN" "dist-cli/${{ matrix.cli_name }}"

          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path dist-cli\${{ matrix.cli_name }} -DestinationPath ${{ matrix.archive_name }} -Force"
          else
            chmod +x "dist-cli/${{ matrix.cli_name }}"
            tar -czf "${{ matrix.archive_name }}" -C dist-cli "${{ matrix.cli_name }}"
          fi

      - name: Upload stkpil CLI asset to Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const release_id = '${{ needs.create-release.outputs.release_id }}';
            const archiveName = '${{ matrix.archive_name }}';
            const filePath = path.resolve(archiveName);

            if (fs.existsSync(filePath)) {
              const fileData = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release_id,
                name: archiveName,
                data: fileData,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': fileData.length
                }
              });
              core.info(`Uploaded CLI asset: ${archiveName}`);
            } else {
              core.setFailed(`CLI archive not found: ${filePath}`);
            }

  publish-release:
    needs: [create-release, build-tauri, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
